<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense TrackerS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewScreen">

    <section class="card">
      <h2>Expense Tracker</h2>

      <div id="balance">
        <h3>Total spent</h3>
        <h1 id="total-amount">—</h1>
        <p id="total-note" class="note"></p>
      </div>

      <div class="home-currency">
        <label for="home-currency">Show totals in</label>
        <select id="home-currency"></select>
      </div>

      <div id="status" class="status loading" role="status" aria-live="polite">
        
      </div>

      <h3>Add Expense</h3>
      <form id="expense-form">
        <input type="text" id="expense-text" placeholder="Description e.g. Uber" required>
        <input type="number" id="expense-amount" placeholder="Amount"  required>
        <select id="expense-currency" aria-label="Currency"></select>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Records</h2>
      <ul id="list" class="list"></ul>
      <p id="empty-msg" class="note" hidden>No records yet. Add one on the left.</p>
    </section>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
