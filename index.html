<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker with Live Currency Conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">

    <section class="card" id="expense-logging">
      <h2>Expense Tracker</h2>

      <div id="balance">
        <h3 id="total-label">Total spent</h3>
        <h1 id="total-amount">—</h1>
        <p id="total-note" class="note"></p>
      </div>

      <div class="home-currency">
        <label for="home-currency">Show totals in</label>
        <select id="home-currency"></select>
      </div>

      <div id="status" class="status loading" role="status" aria-live="polite">
        Fetching live exchange rates...
      </div>
      <button id="retry-btn" type="button" hidden>Try again</button>

      <h3>Add Expense</h3>
      <form id="expense-form">
        <input type="text" id="expense-text" placeholder="Description, e.g. Lunch" required>
        <input type="number" id="expense-amount" placeholder="Amount" min="0.01" step="0.01" required>
        <div class="row">
          <select id="expense-currency" aria-label="Currency"></select>
          <select id="expense-category" aria-label="Category"></select>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="card" id="history-section">
      <h2>Expenses</h2>
      <div class="filter">
        <label for="filter-category">Category</label>
        <select id="filter-category"></select>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty-msg" class="note" hidden>No expenses here yet. Add one on the left.</p>
    </section>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
